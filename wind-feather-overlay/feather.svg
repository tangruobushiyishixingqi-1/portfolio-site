<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600" preserveAspectRatio="none" fill="none">
  <defs>
    <linearGradient id="wind-ink" x1="96" y1="1518" x2="724" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78958b" stop-opacity=".62"/>
      <stop offset=".5" stop-color="#a47789" stop-opacity=".88"/>
      <stop offset="1" stop-color="#8796ac" stop-opacity=".58"/>
    </linearGradient>
    <linearGradient id="wind-mist" x1="126" y1="1435" x2="682" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7e5de" stop-opacity=".04"/>
      <stop offset=".52" stop-color="#e2c3cf" stop-opacity=".2"/>
      <stop offset="1" stop-color="#c6d0de" stop-opacity=".05"/>
    </linearGradient>
    <filter id="wind-soft" x="-15%" y="-8%" width="130%" height="116%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .wind-feather-edge {
        stroke-dasharray: 18 14 62 16;
        animation: wind-feather-edge-flow 8s linear infinite;
      }
      .wind-feather-edge--reverse {
        stroke-dasharray: 8 17 45 12;
        animation: wind-feather-edge-reverse 11s linear infinite;
      }
      .wind-orbit {
        stroke-dasharray: 3 13 30 18;
        animation: wind-orbit-flow 10s linear infinite;
      }
      .wind-orbit--two { animation-delay: -3.4s; }
      .wind-orbit--three { animation-delay: -6.8s; }
      .wind-star {
        transform-box: fill-box;
        transform-origin: center;
        animation: wind-star-glint 4.8s ease-in-out infinite;
      }
      .wind-star--two { animation-delay: -2.1s; }
      @keyframes wind-feather-edge-flow { to { stroke-dashoffset: -220; } }
      @keyframes wind-feather-edge-reverse { to { stroke-dashoffset: 180; } }
      @keyframes wind-orbit-flow { to { stroke-dashoffset: -196; } }
      @keyframes wind-star-glint {
        0%, 100% { opacity: .28; transform: scale(.72); }
        50% { opacity: .85; transform: scale(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wind-feather-edge,
        .wind-feather-edge--reverse,
        .wind-orbit,
        .wind-star { animation: none; }
      }
    </style>
  </defs>

