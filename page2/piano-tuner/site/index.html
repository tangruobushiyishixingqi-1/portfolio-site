<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>钢琴智能调律</title>
    <link rel="stylesheet" href="../../project-back.css" />
    <style>
      * { box-sizing: border-box; }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #1e2225;
        font-family: system-ui, sans-serif;
      }

      /* ── 手机外壳 ── */
      .phone-frame {
        position: relative;
        width: 390px;
        height: 844px;
        flex-shrink: 0;
        border-radius: 48px;
        background: #111;
        box-shadow: 0 0 0 2px #444, 0 20px 80px rgba(0,0,0,0.6);
        padding: 12px;
      }

      .phone-screen {
        width: 100%;
        height: 100%;
        border-radius: 36px;
        overflow: hidden;
        overflow-y: auto;
        background: #f4f1eb;
      }

      /* 刘海 */
      .notch {
        position: absolute; top: 12px; left: 50%;
        transform: translateX(-50%);
        width: 150px; height: 30px;
        background: #111; border-radius: 0 0 18px 18px;
        z-index: 10; pointer-events: none;
      }

      .home-indicator {
        position: absolute; bottom: 20px; left: 50%;
        transform: translateX(-50%);
        width: 134px; height: 5px; border-radius: 999px;
        background: #333; z-index: 10; pointer-events: none;
      }

      /* 手机侧边按钮 */
      .side-btn {
        position: absolute; width: 3px; background: #333;
        border-radius: 0 3px 3px 0; pointer-events: none;
      }
      .side-btn.top    { top: 160px; left: -3px; height: 50px; }
      .side-btn.mid    { top: 230px; left: -3px; height: 80px; }
      .side-btn.bottom { top: 330px; left: -3px; height: 80px; }

      /* 在小屏幕上自适应 */
      @media (max-width: 500px) {
        body { padding: 0; align-items: flex-start; }
        .phone-frame {
          width: 100%; height: 100vh;
          border-radius: 0; box-shadow: none; padding: 0;
        }
        .phone-screen { border-radius: 0; }
        .notch, .home-indicator, .side-btn { display: none; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DLCQZrc2.js"></script>
    <script defer src="../../project-back.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bs8dQHrn.css">
  </head>
  <body>
    <a class="project-return-link" data-project-id="project-piano-tuner" href="../../../index.html#project-piano-tuner">← 返回项目页</a>
    <div class="phone-frame">
      <div class="notch"></div>
      <div class="home-indicator"></div>
      <div class="side-btn top"></div>
      <div class="side-btn mid"></div>
      <div class="side-btn bottom"></div>
      <div class="phone-screen">
        <div id="root"></div>
      </div>
    </div>
  </body>
</html>
